<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>女心リーディング</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Dela+Gothic+One&family=Press+Start+2P&family=M+PLUS+1p:wght@500;700;800&display=swap">
<style>
:root{
  color-scheme:dark;
  --bg:#17111c; --bg2:#221829; --panel:#1e1524; --ink:#f6eef2; --muted:#b9a8bf; --line:#0c0810;
  --pink:#f26c9b; --pink-d:#b8406c; --pink-l:#ffb6cf; --cyan:#7fd6f0; --navy:#1b2447;
  --c-a:#86d4ee; --c-b:#63cb7c; --c-c:#f2d74b; --c-d:#f39a3e;
  --good:#6ff0a8; --warn:#ffc857; --bad:#ff5c6c;
  --pixel:"Press Start 2P","DotGothic16",monospace;
  --dot:"DotGothic16","M PLUS 1p",sans-serif;
  --jp:"M PLUS 1p","Hiragino Sans","Noto Sans JP",sans-serif;
  --logo:"Dela Gothic One","DotGothic16",sans-serif;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--jp);font-size:15px;line-height:1.6;padding-inline:16px;padding-block:18px 32px;
  background:
    radial-gradient(120% 80% at 50% 0%, #2a1b33 0%, var(--bg) 60%) fixed;
  min-height:100%}
body.crt::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 1px,transparent 1px 3px);
  mix-blend-mode:multiply}
body.crt::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:49;
  background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.45) 100%)}
.wrap{max-width:560px;margin:0 auto;display:grid;gap:14px}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
button:focus-visible{outline:3px solid var(--cyan);outline-offset:3px}
img.px{image-rendering:pixelated;image-rendering:crisp-edges;display:block}

/* ---- pixel frame helper: hard 2-step border via box-shadow ---- */
.pxbox{border:3px solid var(--line);border-radius:10px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.55),inset 0 -4px 0 2px rgba(0,0,0,.12)}

/* ---- logo ---- */
.logo{text-align:center;display:grid;gap:4px;margin-top:4px}
.logo h1{margin:0;font-family:var(--logo);font-weight:400;font-size:clamp(34px,10vw,52px);line-height:1.1;letter-spacing:.02em;
  color:var(--pink);-webkit-text-stroke:3px var(--navy);paint-order:stroke fill;
  text-shadow:0 4px 0 var(--cyan),0 7px 0 #0b0714}
.logo .sub{font-family:var(--pixel);font-size:10px;letter-spacing:.14em;color:#d7cfe0;text-shadow:2px 2px 0 #000}
.logo.small h1{font-size:clamp(24px,7vw,32px);-webkit-text-stroke:2px var(--navy)}

/* ---- title screen ---- */
.intro{font-family:var(--dot);font-size:14px;color:var(--muted);text-align:center;margin:0}
.rules{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:0;margin:0;list-style:none}
.rules li{font-family:var(--dot);font-size:12.5px;background:var(--bg2);border:2px solid #3b2c45;border-radius:4px;padding:2px 8px;color:#e8dcee}
.select-h{font-family:var(--pixel);font-size:11px;color:var(--pink-l);text-align:center;letter-spacing:.1em;margin:6px 0 0;animation:blink 1.1s steps(1) infinite}
.cards{display:grid;gap:12px}
.card{display:grid;grid-template-columns:112px 1fr;gap:12px;align-items:stretch;text-align:left;
  background:#2a3040;border:3px solid var(--line);border-radius:8px;padding:0;overflow:hidden;
  box-shadow:inset 0 0 0 2px #4a5264;transition:transform .12s steps(2)}
.card:hover{transform:translate(-2px,-2px);box-shadow:inset 0 0 0 2px var(--cc),4px 4px 0 var(--cc)}
.card .pf{background:var(--cbg);border-right:3px solid var(--line);position:relative;overflow:hidden;min-height:136px}
.card .pf img{position:absolute;left:50%;top:0;width:158px;height:auto;transform:translateX(-50%);max-width:none}
.card .info{padding:10px 12px 10px 0;display:grid;gap:5px;align-content:start}
.card .nm{font-family:var(--pixel);font-size:17px;color:#fff;background:#1a1e2a;padding:6px 8px;border-radius:3px;letter-spacing:.06em;text-shadow:2px 2px 0 #000}
.card .ty{font-family:var(--dot);font-size:13px;color:var(--cc2)}
.card .tags{display:flex;flex-wrap:wrap;gap:4px 10px}
.card .tags span{font-family:var(--pixel);font-size:9px;color:#e6e0ee}
.card .tags span::before{content:"\2665 ";color:var(--pink)}
.card .q{font-family:var(--dot);font-size:13px;color:#fff}
.card .df{font-family:var(--dot);font-size:12px;color:var(--muted)}
.card .df b{color:var(--warn);letter-spacing:.1em;font-weight:400}

/* ---- HUD ---- */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);padding-block:6px 8px;display:grid;gap:6px;border-bottom:2px solid #2d2136}
.hud-row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.qno{font-family:var(--pixel);font-size:10px;color:var(--cyan);letter-spacing:.08em}
.irr{font-family:var(--pixel);font-size:10px;color:#fff;display:flex;align-items:center;gap:8px}
.irr .lab{font-family:var(--dot);font-size:13px;color:var(--pink-l)}
.irr .num{font-size:14px;font-variant-numeric:tabular-nums}
.irr .dl{font-size:10px}
.irr .dl.up{color:var(--bad)} .irr .dl.down{color:var(--good)}
.meter{display:grid;grid-template-columns:repeat(20,1fr);gap:2px;padding:3px;background:#0b0710;border:2px solid #3d2e48;border-radius:3px}
.meter i{height:10px;background:#2b2033;border-radius:1px}
.meter i.on{background:var(--seg)}
.meter.flash{animation:mflash .5s steps(2) 2}
@keyframes mflash{50%{border-color:var(--bad);box-shadow:0 0 0 2px var(--bad)}}

/* ---- portrait stage ---- */
.stage{position:relative;margin-top:4px}
.frame{position:relative;height:232px;border-radius:14px;background:var(--cbg);border:4px solid var(--line);
  box-shadow:inset 0 0 0 3px var(--cfr),inset 0 0 0 6px rgba(255,255,255,.35);overflow:hidden}
.frame::before{content:"";position:absolute;inset:0;background:
  radial-gradient(circle at 50% 110%,rgba(255,255,255,.35),transparent 60%);pointer-events:none}
.frame img{position:absolute;left:50%;top:-12px;width:252px;height:auto;max-width:none;transform:translateX(-50%)}
.frame .mood{position:absolute;right:10px;top:10px;font-family:var(--dot);font-size:12px;background:#0b0710;color:var(--mc);border:2px solid var(--mc);border-radius:3px;padding:0 6px;line-height:1.6}
.frame .who{position:absolute;right:10px;bottom:10px;font-family:var(--pixel);font-size:10px;color:#fff;background:#0b0710cc;padding:4px 6px;border-radius:2px;letter-spacing:.1em}
.talk{position:absolute;left:-6px;bottom:-16px;font-family:var(--logo);font-size:24px;line-height:1;color:#1b1026;background:var(--pink);
  border:3px solid var(--line);border-radius:6px;padding:6px 10px;box-shadow:inset 0 0 0 2px var(--pink-l)}
.talk::after{content:"";position:absolute;right:-14px;top:8px;border:8px solid transparent;border-left:12px solid var(--line)}
.talk::before{content:"";position:absolute;right:-8px;top:11px;border:5px solid transparent;border-left:8px solid var(--pink);z-index:1}
.bounce img{animation:bounce .5s steps(4)}
@keyframes bounce{30%{transform:translate(-50%,-8px)}60%{transform:translate(-50%,0)}80%{transform:translate(-50%,-3px)}}
.shake{animation:shake .4s steps(6)}
@keyframes shake{20%{transform:translate(-6px,2px)}40%{transform:translate(6px,-2px)}60%{transform:translate(-4px,0)}80%{transform:translate(3px,1px)}}

.line{font-family:var(--jp);font-weight:700;font-size:clamp(17px,4.6vw,21px);text-align:center;line-height:1.5;margin:22px 4px 2px;text-wrap:balance;text-shadow:2px 2px 0 #000}
.line .sit{display:block;font-family:var(--dot);font-weight:400;font-size:12.5px;color:var(--muted);margin-bottom:2px;text-shadow:none}

/* ---- choices ---- */
.choices{display:grid;gap:9px}
.choice{display:grid;grid-template-columns:48px 1fr auto;align-items:stretch;text-align:left;min-height:56px;
  background:var(--cc);border:3px solid var(--line);border-radius:8px;overflow:hidden;
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.6),inset 0 -5px 0 2px rgba(0,0,0,.12);transition:transform .08s steps(2),opacity .2s}
.choice:hover:not([disabled]){transform:translateX(4px)}
.choice:active:not([disabled]){transform:translate(4px,2px)}
.choice .k{display:grid;place-items:center;border-right:3px solid var(--line);background:rgba(255,255,255,.28)}
.choice .k span{font-family:var(--pixel);font-size:17px;color:#fff;-webkit-text-stroke:0;text-shadow:2px 0 0 var(--line),-2px 0 0 var(--line),0 2px 0 var(--line),0 -2px 0 var(--line),2px 2px 0 var(--line),-2px -2px 0 var(--line),2px -2px 0 var(--line),-2px 2px 0 var(--line)}
.choice .t{padding:10px 12px;font-weight:700;font-size:15.5px;color:#15101a;display:flex;align-items:center;line-height:1.45}
.choice .r{display:flex;align-items:center;padding-right:10px}
.choice[disabled]{cursor:default}
.choice.dim{opacity:.42}
.choice.ok{box-shadow:inset 0 0 0 2px #fff,0 0 0 3px #fff,0 0 14px 3px rgba(255,255,255,.55);animation:okglow .9s steps(2) infinite}
@keyframes okglow{50%{box-shadow:inset 0 0 0 2px #fff,0 0 0 3px var(--good),0 0 14px 3px rgba(111,240,168,.5)}}
.choice.ng{box-shadow:inset 0 0 0 2px rgba(255,255,255,.6),0 0 0 3px var(--bad)}
.badge{font-family:var(--pixel);font-size:10px;padding:5px 6px;border:2px solid var(--line);border-radius:3px;white-space:nowrap;line-height:1}
.badge.g{background:var(--good);color:#0b2416}
.badge.w{background:var(--warn);color:#2a1a00}
.badge.b{background:var(--bad);color:#fff}
.badge.s{background:#0b0710;color:#e6dcea;border-color:#0b0710}

/* ---- verdict window ---- */
.win{background:#120c18;border:3px solid #f1e6f6;border-radius:6px;box-shadow:0 0 0 3px var(--line),inset 0 0 0 3px #3b2a47;padding:14px 16px;display:grid;gap:8px}
.win h3{margin:0;font-family:var(--dot);font-weight:400;font-size:24px;display:flex;align-items:center;flex-wrap:wrap;gap:10px;letter-spacing:.04em}
.win.ok h3{color:var(--good)} .win.near h3{color:var(--warn)} .win.ng h3{color:var(--bad)}
.tag{font-family:var(--dot);font-size:12px;padding:0 8px;border-radius:3px;border:2px solid currentColor;line-height:1.6}
.tag.mine{color:#fff;background:var(--bad);border-color:var(--bad)}
.tag.trap{color:#2a1a00;background:var(--warn);border-color:var(--warn)}
.tag.norm{color:var(--muted)}
.win .ans{margin:0;font-size:14px;color:#e9dff0}
.win .ans b{color:var(--good)}
.win .why{margin:0;font-size:14.5px;line-height:1.75;color:#fff;max-width:60ch}
.next{justify-self:end;font-family:var(--dot);font-size:16px;color:#fff;padding:4px 2px;display:flex;align-items:center;gap:6px}
.next::after{content:"\25BC";font-size:12px;color:var(--pink);animation:blink .8s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* ---- footer ---- */
.foot{display:flex;justify-content:center;gap:26px;margin-top:6px;padding-top:10px;border-top:2px solid #2d2136}
.foot button{font-family:var(--pixel);font-size:10px;color:#cfc4d8;letter-spacing:.1em;display:flex;align-items:center;gap:8px}
.foot button:hover{color:#fff}
.foot .ico{display:inline-block;width:12px;height:10px;background:currentColor;
  clip-path:polygon(0 0,100% 0,100% 20%,0 20%,0 40%,100% 40%,100% 60%,0 60%,0 80%,100% 80%,100% 100%,0 100%)}
.foot .ico.snd{width:12px;height:12px;clip-path:polygon(0 30%,35% 30%,80% 0,80% 100%,35% 70%,0 70%)}
.foot .off{opacity:.55;text-decoration:line-through}

/* ---- result ---- */
.res-head{display:grid;justify-items:center;gap:6px;text-align:center}
.res-head .big{font-family:var(--pixel);font-size:clamp(20px,6vw,28px);letter-spacing:.08em;text-shadow:3px 3px 0 #000}
.res-head .big.clear{color:var(--good)} .res-head .big.over{color:var(--bad)}
.res-head p{margin:0;font-family:var(--dot);font-size:15px;color:#efe4f4}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:#120c18;border:3px solid #3b2a47;border-radius:4px;padding:8px;text-align:center}
.stat span{display:block;font-family:var(--dot);font-size:12px;color:var(--muted)}
.stat b{font-family:var(--pixel);font-size:15px;font-weight:400;color:#fff;font-variant-numeric:tabular-nums}
.rank .r{font-family:var(--dot);font-size:20px;color:var(--pink-l)}
.rank p{margin:0;font-size:14px}
.review h4{margin:0 0 6px;font-family:var(--dot);font-weight:400;font-size:15px;color:var(--pink-l)}
.review ol{margin:0;padding-left:1.4em;display:grid;gap:6px;font-size:13.5px}
.review li span{font-family:var(--pixel);font-size:10px;color:var(--bad)}
.acts{display:grid;gap:9px}
.btn{font-family:var(--dot);font-size:17px;padding:10px 14px;border:3px solid var(--line);border-radius:8px;background:var(--pink);color:#1b1026;
  box-shadow:inset 0 0 0 2px var(--pink-l),inset 0 -5px 0 2px rgba(0,0,0,.15);text-align:center}
.btn.alt{background:var(--c-a);box-shadow:inset 0 0 0 2px #d6f4ff,inset 0 -5px 0 2px rgba(0,0,0,.15)}
.btn:hover{transform:translateX(3px)}


/* ===== one-screen layout ===== */
html{height:100%}
body{height:100%;margin:0;overflow:hidden;padding-block:10px 6px}
.wrap{height:100%;display:flex;flex-direction:column;gap:8px;max-width:520px}
.wrap>*{flex:none}
.logo{margin-top:0}
.logo h1{font-size:clamp(28px,8.5vw,44px)}
.intro{font-size:13px;line-height:1.5}
.select-h{margin:0}
.cards{flex:1 1 0;min-height:0;display:flex;flex-direction:column;gap:8px;overflow:auto;padding:2px}
.card{flex:1 1 0;min-height:86px;max-height:132px;grid-template-columns:clamp(84px,26vw,110px) 1fr;gap:10px}
.card .pf{min-height:0}
.card .pf img{position:absolute;inset:0;left:0;top:0;transform:none;width:100%;height:100%;object-fit:cover;object-position:50% 12%}
.card .info{gap:1px;padding:7px 10px 7px 0;align-content:center}
.card .nm{font-size:13px;padding:4px 6px;display:flex;justify-content:space-between;align-items:center}
.card .nm small{font-family:var(--dot);font-size:12px;color:var(--warn);text-shadow:none;letter-spacing:.08em}
.card .ty,.card .q{font-size:12.5px}
.hud{position:static;border-bottom:0;padding:0;gap:4px}
.hud .nmx{font-family:var(--logo);font-size:13px;color:var(--pink);letter-spacing:.04em}
.stage{flex:1 1 0;min-height:92px;max-height:300px;margin-top:0}
.frame{height:100%}
.frame img{width:auto;height:128%;top:-5%}
.talk{font-size:20px;padding:5px 8px;bottom:-12px}
.line{margin:12px 4px 0;font-size:clamp(16px,4.4vw,19px);line-height:1.45}
.choices{gap:7px}
.choice{min-height:46px;grid-template-columns:42px 1fr auto}
.choice .k span{font-size:14px}
.choice .t{padding:6px 10px;font-size:14.5px;line-height:1.4}
.win{padding:9px 14px;gap:3px}
.win h3{font-size:19px}
.win .why{font-size:13.5px;line-height:1.6}
.next{font-size:15px;padding:0}
.foot{margin-top:0;padding-top:5px;gap:22px}
.res-head{gap:2px}
.res-head .big{font-size:clamp(18px,5.5vw,24px)}
.res-head p{font-size:13.5px}
.stats{gap:6px}
.stat{padding:5px 4px}
.stat span{font-size:11px}
.stat b{font-size:12px}
.rank{gap:0}
.rank .r{font-size:17px}
.rank p{font-size:13px;line-height:1.5}
.review ol{font-size:12.5px;gap:2px}
.review h4{font-size:13px;margin-bottom:2px}
.acts{grid-template-columns:1fr 1fr;gap:8px}
.btn{font-size:14.5px;padding:8px 10px}

.tbar{position:relative;height:16px;background:#0b0710;border:2px solid #3d2e48;border-radius:3px;overflow:hidden;flex:none}
.tbar i{position:absolute;inset:0;transform-origin:left center;background:repeating-linear-gradient(90deg,var(--cyan) 0 10px,#5fc3e3 10px 12px);will-change:transform}
.tbar.warn i{background:repeating-linear-gradient(90deg,var(--c-c) 0 10px,#d9bd2e 10px 12px)}
.tbar.danger i{background:repeating-linear-gradient(90deg,var(--bad) 0 10px,#d63f4e 10px 12px)}
.tbar.danger{animation:tblink .5s steps(1) infinite}
@keyframes tblink{50%{border-color:var(--bad)}}
.tbar b,.tbar span{position:absolute;top:50%;transform:translateY(-50%);font-family:var(--pixel);font-weight:400;font-size:9px;color:#fff;text-shadow:1px 1px 0 #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000}
.tbar b{left:6px}
.tbar span{right:6px;font-size:10px}
.line{margin-bottom:0}

/* ---- title / mode ---- */
.logo.big h1{font-size:clamp(34px,10.5vw,54px)}
.intro{font-family:var(--dot);font-size:15px;color:#efe4f4;text-align:center;margin:0;text-shadow:2px 2px 0 #000}
.trio{flex:1 1 0;min-height:0;max-height:360px;display:flex;gap:8px;align-items:stretch}
.tb{flex:1;position:relative;overflow:hidden;background:var(--cbg);border:3px solid var(--line);border-radius:8px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.45)}
.tb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 15%}
.press{align-self:center;font-family:var(--pixel);font-size:16px;color:#fff;letter-spacing:.12em;padding:16px 10px;text-shadow:3px 3px 0 var(--pink-d);animation:blink 1s steps(1) infinite}
.modes{display:grid;gap:10px}
.mode{display:grid;grid-template-columns:1fr auto;grid-template-areas:"mn me" "md md";align-items:center;gap:2px 8px;text-align:left;padding:12px 16px;
  border:3px solid var(--line);border-radius:10px;background:var(--mc);box-shadow:inset 0 0 0 2px rgba(255,255,255,.6),inset 0 -5px 0 2px rgba(0,0,0,.15);transition:transform .08s steps(2)}
.mode:hover{transform:translateX(4px)}
.mode.relax{--mc:var(--c-b)} .mode.doki{--mc:var(--c-d)}
.mode .mn{grid-area:mn;font-family:var(--logo);font-size:21px;color:#15101a;line-height:1.2}
.mode .me{grid-area:me;font-family:var(--pixel);font-size:9px;color:#15101a;background:rgba(255,255,255,.55);border:2px solid var(--line);border-radius:3px;padding:4px 5px}
.mode .md{grid-area:md;font-size:13px;font-weight:700;color:#2a1c24}
.modebar{display:flex;justify-content:center;align-items:center;gap:8px;font-family:var(--dot);font-size:13px;color:var(--muted)}
.chip{font-family:var(--dot);font-size:12.5px;color:#15101a;border:2px solid var(--line);border-radius:4px;padding:1px 8px}
.chip.relax{background:var(--c-b)} .chip.doki{background:var(--c-d)}
.res-head .chip{justify-self:center}
@media (max-height:700px){
  .logo h1{font-size:30px}.intro{font-size:13px}
  .line{font-size:15.5px;margin-top:11px}
  .choice{min-height:40px}.choice .t{font-size:13.5px;padding:5px 9px}
  .win .why{font-size:12.5px;line-height:1.55}.win h3{font-size:17px}
  .review{display:none}
}

/* ---- speech bubble ---- */
.bubble{position:relative;margin:14px 2px 0;padding:14px 14px 10px;background:#fff9f3;color:#1a1020;border:3px solid var(--line);border-radius:10px;
  box-shadow:inset 0 0 0 2px #ffd9e6,4px 4px 0 #0b0710;cursor:pointer;flex:none}
.bubble::before{content:"";position:absolute;left:50%;top:-17px;margin-left:-11px;border:11px solid transparent;border-bottom:14px solid var(--line);border-top:0}
.bubble::after{content:"";position:absolute;left:50%;top:-10px;margin-left:-7px;border:7px solid transparent;border-bottom:10px solid #fff9f3;border-top:0}
.bubble .spk{position:absolute;left:10px;top:-12px;font-family:var(--dot);font-size:12px;line-height:1.5;color:#15101a;border:2px solid var(--line);border-radius:3px;padding:0 8px}
.bubble .sit{display:block;font-family:var(--dot);font-size:12px;color:#7a6878;margin-bottom:1px}
.bubble .say{display:block;font-weight:800;font-size:clamp(16px,4.4vw,19px);line-height:1.45;text-align:center;text-wrap:balance}
.bubble .say .rest{color:transparent}
@media (max-height:700px){.bubble{padding:12px 12px 8px;margin-top:12px}.bubble .say{font-size:15.5px}}

/* ---- stacked choices / ask / ura ---- */
.ask{font-family:var(--dot);font-size:13px;color:var(--pink-l);margin:6px 2px 3px;display:flex;align-items:center;gap:6px;flex:none}
.ask::before{content:"";width:0;height:0;border:5px solid transparent;border-left:7px solid var(--pink);border-right:0}
.choices{gap:0}
.choice{border-radius:0;margin-top:-3px;position:relative}
.choice:first-child{margin-top:0;border-radius:8px 8px 0 0}
.choice:last-child{border-radius:0 0 8px 8px}
.choice:only-child{border-radius:8px}
.choice.ok,.choice.ng{z-index:1}
.ura-toggle{flex:none;align-self:center;font-family:var(--dot);font-size:14px;color:#ffe3a0;background:#2a1f10;border:2px solid #c9962e;border-radius:6px;padding:6px 14px;box-shadow:inset 0 0 0 2px #4a3614}
.ura-toggle:hover{color:#fff;border-color:#f0c24a}
.chip.ura{background:#e0b04a}
body.ura{background:radial-gradient(120% 80% at 50% 0%, #33240f 0%, var(--bg) 60%) fixed}
.cards .card{max-height:150px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

 qs:[
 ["私はどこでもいいよ、あなたの行きたいところで","n",[["候補を3つ出すから選んでよ",0],["じゃあミサキの好きなイタリアンにしよう",6],["本当にどこでもいいの？",8],["じゃあラーメンにしよう！",15]],"好みを覚えているのは◎ですが、今日の気分は聞いていません。遠慮がちな相手には、候補を絞って選んでもらうと本音が出やすくなります。"],
 ["ううん、全然大丈夫（明らかに元気がない）","t",[["そっか。何かあったら言ってね",0],["そっか。じゃあ気分転換に出かけよう",8],["絶対何かあるでしょ、ちゃんと言ってよ",20],["よかった！じゃあ安心した",35]],"引っ掛けです。気分転換は優しいですが、元気がないことに触れずに流しています。問い詰めるのも負担です。気づいていることを伝え、話せる余地を残しましょう。"],

 ["あ、いいよいいよ、私がやるから（食後の皿洗い）","t",[["今日は俺がやるよ、座ってて",0],["じゃあ一緒にやろっか",6],["ありがとう！じゃあ次は俺がやるね",12],["ありがとう、じゃあお願いしようかな",30]],"引っ掛けです。気遣い屋の「私がやる」は、本当は手伝ってほしいサインです。「一緒に」も悪くないですが、彼女を休ませてあげるのが満点です。"],
 ["最近、仕事で失敗ばかりで…","n",[["真面目に向き合ってるの、知ってるよ",0],["失敗なんて誰でもするって",10],["失敗から学べばいいんだよ",12],["向いてないなら、転職も考えてみたら？",20]],"「誰でもする」「学べばいい」は正論ですが、自分を責めている彼女には軽く、説教に聞こえます。頑張りを見ていると伝えましょう。"],

 ["あのね…やっぱりなんでもない","m",[["怒らないから、ゆっくりでいいよ",0],["そっか、話したくなったらでいいよ",8],["え、何？気になるから早く言ってよ",30],["言いかけてやめるの、やめてよ",40]],"「話したくなったらで」は優しいですが、引きすぎです。言いかけた話こそ本音。急かさず、でも今聞く姿勢を見せましょう。"],
 ["今日、お母さんと電話で喧嘩しちゃって","n",[["もやもやするよね。話聞くよ",0],["早めに仲直りしたほうがいいよ",10],["親子喧嘩なんてよくあることだよ",10],["お母さんの言うことも一理あるかもよ",25]],"アドバイスも一般論も、今の彼女には早すぎます。まず気持ちに寄り添いましょう。相手側に立つのは一番傷つきます。"],
 ["誕生日、特に何もしなくていいからね","t",[["わかった。ケーキだけ予約しとくね",0],["本当に？何か欲しいものないの？",12],["サプライズで盛大にお祝いするから！",15],["了解！じゃあ今年は何もしないね",50]],"最大級の引っ掛けです。「何もしなくていい」は「気を遣わせたくない」の意味。聞き出そうとしたり盛大にしたりすると、かえって気を遣わせます。控えめに、でも確実にお祝いしましょう。"],

 ["ちょっと頭痛くて…でも約束だし行くね","n",[["無理しないで。何か買って持ってくよ",0],["無理しないで。今日はゆっくり寝てね",6],["大丈夫？着いたらすぐ薬飲もうね",15],["よかった、ずっと楽しみにしてたんだ！",30]],"キャンセルを勧めるのは◎。そこにケアの行動を添えると満点です。「着いたら」は結局無理をさせています。"],

 ["美容院で失敗されちゃった…","n",[["似合って見えるよ。どこが気になる？",0],["全然変じゃないよ、いつも通り可愛いよ",6],["大丈夫、すぐ伸びるって",12],["確かに、ちょっと変かも",40]],"肯定は◎ですが、本人が気にしている点を聞かないと「本当に見てる？」と思われます。肯定＋気になる点を聞くのが満点です。"],

/* ===== サウンド（Web Audio で生成するチップチューン） ===== */
const SND = (()=>{
  let ctx=null, master=null, bgmBus=null, sfxBus=null, noise=null, timer=null;
  let on = true;
  try{ const v=localStorage.getItem("onna-sound"); if(v==="off") on=false; }catch(e){}
  const mtof = m => 440*Math.pow(2,(m-69)/12);

  // ---- 曲データ（8分音符単位。null=休符、"-"=前の音を伸ばす） ----
  const _ = "-", r = null;
  const TRACKS = {
    main: { bpm:112,
      lead:[76,_,79,_,81,79,76,_,  74,_,76,_,79,76,74,_,  72,_,74,_,77,74,72,69,  71,_,74,_,79,_,_,_,
            76,_,79,_,84,83,81,_,  79,_,76,_,79,81,83,_,  84,_,83,_,81,79,76,_,  74,_,77,_,79,_,71,_],
      bass:[41,40,38,43,41,40,45,43],
      chords:[[65,69,72,76],[64,67,71,74],[62,65,69,72],[67,71,74,77],[65,69,72,76],[64,67,71,74],[69,72,76,79],[67,71,74,79]],
      bassPat:[0,12,0,12,0,12,7,12], drums:true },
    quiz: { bpm:124, arp:"stab", kick:[0,10], snare:[4,12], hat16:true,
      lead:[74,_,78,81,78,_,74,_,  71,_,74,78,74,_,71,_,  79,_,78,76,74,_,71,74,  76,_,_,_,73,_,76,_,
            81,_,78,_,74,78,81,_,  83,_,81,_,78,74,71,_,  79,81,79,78,76,_,74,_,  73,_,76,_,81,_,_,_],
      bass:[38,47,43,45,38,47,43,45],
      chords:[[62,66,69],[59,62,66],[55,59,62],[57,61,64],[62,66,69],[59,62,66],[55,59,62],[57,61,64]],
      bassPat:[0,12,7,12,0,12,7,12], drums:true },
    tense:{ bpm:136,
      lead:[81,_,81,79,81,_,84,_,  77,_,77,76,77,_,81,_,  79,_,79,77,79,_,83,_,  80,_,76,_,80,_,83,_],
      bass:[45,41,43,40],
      chords:[[69,72,76],[65,69,72],[67,71,74],[64,68,71]],
      bassPat:[0,0,12,0,0,12,0,12], drums:true }
  };

  function init(){
    if(ctx) return true;
    const AC = window.AudioContext||window.webkitAudioContext; if(!AC) return false;
    ctx = new AC();
    master = ctx.createGain(); master.gain.value = on?0.55:0; master.connect(ctx.destination);
    bgmBus = ctx.createGain(); bgmBus.gain.value = 0.32; bgmBus.connect(master);
    sfxBus = ctx.createGain(); sfxBus.gain.value = 0.7; sfxBus.connect(master);
    const len = ctx.sampleRate*1; noise = ctx.createBuffer(1,len,ctx.sampleRate);
    const d = noise.getChannelData(0); for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
    timer = setInterval(tick, 25);
    return true;
  }
  function unlock(){ if(!init()) return; if(ctx.state==="suspended") ctx.resume(); }

  // ---- 音源 ----
  function tone(freq,t,dur,type,vol,dest,slideTo){
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.type=type; o.frequency.setValueAtTime(freq,t);
    if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo,t+dur);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol,t+0.006);
    g.gain.exponentialRampToValueAtTime(vol*0.55,t+Math.min(0.08,dur*0.5));
    g.gain.setValueAtTime(vol*0.55,t+Math.max(0.01,dur-0.03));
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(dest||sfxBus); o.start(t); o.stop(t+dur+0.02);
  }
  function hiss(t,dur,vol,freq,type,dest){
    const s=ctx.createBufferSource(); s.buffer=noise;
    const f=ctx.createBiquadFilter(); f.type=type||"highpass"; f.frequency.value=freq||6000;
    const g=ctx.createGain(); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    s.connect(f); f.connect(g); g.connect(dest||sfxBus); s.start(t); s.stop(t+dur+0.02);
  }
  function kick(t,dest){
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.type="sine"; o.frequency.setValueAtTime(150,t); o.frequency.exponentialRampToValueAtTime(42,t+0.12);
    g.gain.setValueAtTime(0.7,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.16);
    o.connect(g); g.connect(dest); o.start(t); o.stop(t+0.18);
  }

  // ---- BGM シーケンサ ----
  const bgm = { name:null, step:0, next:0 };
  function play(name){
    if(!ctx || bgm.name===name) return;
    bgm.name=name; bgm.step=0; bgm.next=ctx.currentTime+0.08;
  }
  function stop(){ bgm.name=null; }
  function tick(){
    if(!ctx || !bgm.name || ctx.state!=="running") return;
    const T=TRACKS[bgm.name], s16=60/T.bpm/4, total=T.lead.length*2;
    while(bgm.next < ctx.currentTime+0.15){
      const st=bgm.step, t=bgm.next, bar=Math.floor(st/16)%T.bass.length, inBar=st%16;
      // lead (8分単位)
      if(st%2===0){
        const i=st/2, n=T.lead[i];
        if(typeof n==="number"){
          let len=1; while(T.lead[(i+len)%T.lead.length]==="-" && len<8) len++;
          tone(mtof(n),t,len*s16*2*0.92,"square",0.16,bgmBus);
          tone(mtof(n+12),t,len*s16*2*0.6,"triangle",0.05,bgmBus);
        }
        const root=T.bass[bar], bp=T.bassPat[(inBar/2)%8];
        tone(mtof(root+bp),t,s16*1.7,"triangle",0.34,bgmBus);
      }
      // 伴奏
      const ch=T.chords[bar];
      if(T.arp==="stab"){ if(inBar%4===2) ch.forEach(n=>tone(mtof(n+12),t,s16*0.9,"square",0.028,bgmBus)); }
      else tone(mtof(ch[inBar%ch.length]),t,s16*0.8,"square",0.035,bgmBus);
      // ドラム
      if(T.drums){
        if(T.kick ? T.kick.includes(inBar) : inBar%8===0) kick(t,bgmBus);
        if(T.snare ? T.snare.includes(inBar) : inBar%8===4) hiss(t,0.12,0.16,1800,"highpass",bgmBus);
        if(T.hat16 ? true : inBar%2===0) hiss(t,0.03,T.hat16&&inBar%2?0.03:0.05,7000,"highpass",bgmBus);
      }
      bgm.next+=s16; bgm.step=(st+1)%total;
    }
  }

  // ---- 効果音 ----
  const sfx = {
    select(){ const t=ctx.currentTime; tone(988,t,0.06,"square",0.18); tone(1319,t+0.06,0.09,"square",0.18); },
    blip(f){ const t=ctx.currentTime; tone((f||800)*(0.94+Math.random()*0.12),t,0.045,"square",0.08); },
    tick(){ const t=ctx.currentTime; tone(1760,t,0.04,"square",0.12); },
    timeup(){ const t=ctx.currentTime; [0,0.12,0.24].forEach(d=>tone(1320,t+d,0.08,"square",0.16)); tone(165,t+0.4,0.45,"square",0.2); },
    next(){ const t=ctx.currentTime; tone(1568,t,0.05,"square",0.12); },
    start(){ const t=ctx.currentTime; [72,76,79,84].forEach((m,i)=>tone(mtof(m),t+i*0.07,0.12,"square",0.18)); tone(mtof(88),t+0.28,0.3,"square",0.16); },
    correct(){ const t=ctx.currentTime; [84,88,91,96].forEach((m,i)=>{tone(mtof(m),t+i*0.06,0.14,"square",0.17);tone(mtof(m-12),t+i*0.06,0.14,"triangle",0.12);}); },
    spark(){ sfx.correct(); const t=ctx.currentTime+0.26; [100,103,108,103,108].forEach((m,i)=>tone(mtof(m),t+i*0.05,0.08,"triangle",0.1)); },
    near(){ const t=ctx.currentTime; tone(mtof(76),t,0.12,"triangle",0.28); tone(mtof(71),t+0.13,0.22,"triangle",0.28); },
    wrong(){ const t=ctx.currentTime; tone(196,t,0.16,"square",0.2); tone(147,t+0.2,0.32,"square",0.2); },
    mine(){ const t=ctx.currentTime;
      hiss(t,0.7,0.5,1200,"lowpass"); kick(t,sfxBus); kick(t+0.08,sfxBus);
      tone(420,t,0.6,"square",0.18,sfxBus,55); tone(300,t+0.05,0.55,"sawtooth",0.1,sfxBus,40); },
    clear(){ const t=ctx.currentTime; const m=[72,76,79,84,79,84,88];
      m.forEach((n,i)=>tone(mtof(n),t+i*0.13,0.14,"square",0.17));
      [76,79,84,88].forEach(n=>tone(mtof(n),t+0.95,1.2,"square",0.08)); tone(mtof(48),t+0.95,1.2,"triangle",0.3); },
    over(){ const t=ctx.currentTime; [71,70,69,68].forEach((n,i)=>tone(mtof(n),t+i*0.32,0.3,"square",0.16));
      tone(mtof(44),t+1.28,1.4,"triangle",0.32); tone(mtof(56),t+1.28,1.4,"square",0.06); }
  };
  function fx(name,arg){ if(!ctx||!on) return; if(ctx.state==="suspended") ctx.resume(); sfx[name]&&sfx[name](arg); }

  function setOn(v){
    on=v; try{ localStorage.setItem("onna-sound", v?"on":"off"); }catch(e){}
    if(ctx) master.gain.setTargetAtTime(v?0.55:0, ctx.currentTime, 0.02);
  }
  return { unlock, play, stop, fx, setOn, get on(){ return on; } };
})();

function exprFor(irr){ return irr>=80?"angry":irr>=55?"annoyed":irr>=30?"shock":"calm"; }
function moodOf(irr){
  if(irr>=80) return ["爆発寸前","var(--bad)"];

const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const esc = s => String(s).replace(/[&<>"]/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));

function start(id){
  const n = CHARS[id].qs.length;
  const order = shuffle([...Array(n).keys()]).slice(0,GAME_LEN);
  SND.unlock(); SND.fx("start");
  S = {screen:"game", timed:MODE==="doki", id, order, idx:0, irr:0, picked:null, perm:shuffle([0,1,2,3]),
       correct:0, mineTotal:0, mineOk:0, last:0, misses:[], deadline:null, typedIdx:-1, timeout:false};
  render();
}
function timeUp(){
  if(S.screen!=="game" || S.picked!==null) return;
  const q = CHARS[S.id].qs[S.order[S.idx]];
  S.picked = -1; S.timeout = true;
  S.irr += TIME_PEN; S.last = TIME_PEN;
  S.misses.push([q[0], "（時間切れ）", TIME_PEN]);
  if(q[1]==="m"||q[1]==="t") S.mineTotal++;
  SND.fx("timeup");
  render(true);
}
let lastSec = -1;
function timerLoop(){
  if(S.screen==="game" && S.timed && S.picked===null && S.deadline){
    const rem = Math.max(0, S.deadline-Date.now());
    const f = document.getElementById("tfill"), sec = document.getElementById("tsec"), bar = document.getElementById("tbar");
    if(f){ const r=Math.min(1,rem/LIMIT); f.style.transform=`scaleX(${r})`;
      bar.classList.toggle("warn", rem<=5000 && rem>3000); bar.classList.toggle("danger", rem<=3000); }
    const s = Math.ceil(rem/1000);
    if(sec) sec.textContent = s;
    if(s!==lastSec){ if(s<=3 && s>0) SND.fx("tick"); lastSec=s; }
    if(rem<=0) timeUp();
  }
  requestAnimationFrame(timerLoop);
}
requestAnimationFrame(timerLoop);
function answer(pos){
  if(S.picked!==null) return;
  const q = CHARS[S.id].qs[S.order[S.idx]];
  const ci = S.perm[pos], pen = q[2][ci][1], before = S.irr;
  S.picked = pos;
  if(ci===0){ S.correct++; }
  else { S.irr += pen; S.misses.push([q[0], q[2][ci][0], pen]); }
  if(q[1]==="m"||q[1]==="t"){ S.mineTotal++; if(ci===0) S.mineOk++; }
  S.last = S.irr - before;
  SND.fx(ci===0 ? ((q[1]==="m"||q[1]==="t")?"spark":"correct") : pen<=12?"near" : pen>=30?"mine":"wrong");
  render(true);
}
function next(){
  if(S.irr>=MAX){ S.screen="over"; SND.fx("over"); }
  else if(S.idx>=S.order.length-1){ S.screen="clear"; SND.fx("clear"); }
  else { S.idx++; S.picked=null; S.timeout=false; S.perm=shuffle([0,1,2,3]); S.last=0; S.deadline=null; SND.fx("next"); }
  render();
}

    <h3>${tout?"時間切れ…":ok?"正解！":near?"惜しい！":"不正解…"}<span class="tag ${kCls}">${kLabel}</span></h3>
    <p class="why">${esc(q[3])}</p>
    <button class="next" data-act="next" id="nextBtn">${S.irr>=MAX||S.idx>=S.order.length-1?"結果を見る":"次のひと言へ"}</button>
  </section>`:""}

}

function rankOf(r){
  if(CHARS[S.id].ura){
    if(r>=0.95) return ["伝説の側近","歴史に名を残す忠臣です。どんな局面でも主君の心を読み切りました。"];
    if(r>=0.8)  return ["頼れる右腕","ほとんどの場面で主君を支えられています。惜しい選択肢だけ気をつければ完璧です。"];
    if(r>=0.6)  return ["見習い従者","基本はできています。相手の信念や時代背景を意識するとさらに伸びます。"];
    if(r>=0.4)  return ["新参者","言葉を額面通りに受け取りがちです。相手の誇りや立場に目を向けましょう。"];
    return ["追放寸前","主君の逆鱗に触れ続けています。まずは相手の話を最後まで聞くことから始めましょう。"];
  }
  if(r>=0.95) return ["女心マスター","もはや読心術の域です。どんな地雷も見抜ける、頼れるパートナーです。"];
  if(r>=0.8)  return ["気配り上手","ほとんどの場面で安心させられています。惜しい選択肢だけ気をつければ完璧です。"];
  if(r>=0.6)  return ["見習い彼氏","基本はできています。「共感が先、解決はあと」を意識するとぐっと伸びます。"];
  if(r>=0.4)  return ["鈍感さん","言葉を額面通りに受け取りがちです。裏にある気持ちを一度想像してみましょう。"];
  return ["地雷原ランナー","正論や本音が、ことごとく地雷を踏んでいます。まずは「聞く」ことから始めましょう。"];
}
function endView(win){
  const c = CHARS[S.id], L = LOOK[S.id], n = S.idx+1;
  const [rk,rkd] = rankOf(S.correct/S.order.length);
  const worst = S.misses.slice().sort((a,b)=>b[2]-a[2]).slice(0,3);
  return `<div class="stage" style="--cbg:${L.bg};--cfr:${L.fr}">
    <div class="frame"><img class="px" src="${SPR[S.id][win?"happy":"angry"]}" alt="${esc(c.name)}"></div>
  </div>
  <div class="res-head">
    <span class="chip ${S.timed?"doki":"relax"}">${MODES[S.timed?"doki":"relax"].name}</span>
    <div class="big ${win?"clear":"over"}">${win?"GAME CLEAR":"GAME OVER"}</div>
    <p>${win?`${esc(c.name)}と最後まで仲良し。最終イライラ度 ${S.irr}`:`第${n}問でイライラ度が ${S.irr} に。${esc(c.name)}の怒りが爆発しました`}</p>
  </div>
  <div class="stats">
    <div class="stat"><span>正解数</span><b>${S.correct}/${n}</b></div>
    <div class="stat"><span>正解率</span><b>${Math.round(S.correct/n*100)}%</b></div>
    <div class="stat"><span>地雷回避</span><b>${S.mineOk}/${S.mineTotal}</b></div>
    <div class="stat"><span>イライラ</span><b>${S.irr}</b></div>
  </div>
  <div class="win rank">${win?`<span class="r">称号：${rk}</span><p>${rkd}</p>`:
    `<span class="r">あと ${S.order.length-n} 問でした</span><p>${c.ura?"正解してもイライラは減りません。相手の信念や時代背景を踏まえて答えるのがコツです。":"正解してもイライラは減りません。「大丈夫」「いいよ」の裏を読むのがコツです。"}</p>`}</div>
  ${worst.length?`<div class="win review"><h4>イライラが大きかった返し</h4><ol>
    ${worst.map(w=>`<li>「${esc(w[0].replace(/^（.+?）/,""))}」に「${esc(w[1])}」 <span>+${w[2]}</span></li>`).join("")}</ol></div>`:""}
  <div class="acts">
    <button class="btn" data-start="${S.id}">${esc(c.name)}でもう一度</button>
    <button class="btn alt" data-act="select">別のタイプを選ぶ</button>
  </div>
  ${footer()}`;
}

Object.assign(CHARS, {
himiko:{ ura:true,
 name:"卑弥呼", type:"邪馬台国の女王・神秘派", color:"#C9962E", hair:"#2a2020",
 desc:"鬼道で国を治める女王。人前に姿を見せず、あなたは言葉を取り次ぐ唯一の側近。",
 quote:"「占いによれば…」", diff:"",
 qs:[
 ["今朝の占い、骨のひびが悪い形であった…","n",[["ご不安でしょう。私にできることは？",0],["では今日の儀式は取りやめましょうか",8],["もう一度占ってみてはいかがでしょう",10],["占いなど気にしすぎではありませんか",25]],"卑弥呼は鬼道（占い・まじない）で国を治めた女王です。占いは政そのもの。まず不安を受け止めましょう。すぐ結論を出したり、占いを軽んじたりするのは禁物です。"],
 ["魏の国へ使いを送ろうと思うのじゃ","n",[["大国と結べば安泰です。お供します",0],["贈り物は何にいたしましょう？",6],["海を渡るのは危険ではありませんか",10],["わざわざ遠い国に頭を下げるのですか",25]],"239年、卑弥呼は魏に使いを送り「親魏倭王」の称号を得ました。大きな決断には、まず賛同と支える姿勢で応えましょう。"],
 ["魏の皇帝から金印を賜ったぞ","n",[["おめでとうございます。親魏倭王ですね",0],["これで狗奴国も手を出せませんね",6],["すごい！金印の重さはどのくらいですか？",8],["印なんて、何に使うんです？",20]],"「親魏倭王」の称号と金印は、大国の後ろ盾を得た証です。称号まで言えると、功績を理解していると伝わります。"],
 ["わらわの姿を見たいと申す者がおる","n",[["お姿は見せず、お言葉だけ伝えます",0],["どんな者か、先に調べてまいります",6],["皆、女王様に興味津々なんですよ",12],["一度くらい、お顔を見せてはどうです？",20]],"王となってからの卑弥呼は人前にほとんど姿を見せず、言葉は一人の男が取り次いだと伝わります。神秘性を守るのが側近の務めです。"],
 ["弟がまた政に口を出してきたのじゃ","n",[["まずお話を伺います。何があったのです？",0],["私から弟君へ、それとなく伝えておきましょうか",6],["弟君も国のことを思ってのことかと",8],["弟君に全部任せてしまえば楽ですよ",25]],"魏志倭人伝には、弟が政治を補佐したとあります。まず女王の気持ちを聞くこと。先に弟の肩を持つと、味方がいないと感じさせます。"],
 ["狗奴国の男王が攻めてきそうじゃ…","m",[["必ずお守りします。魏にも知らせましょう",0],["すぐに兵を集めます。女王様は祈りに専念を",8],["いっそ和睦して従ってはどうです？",40],["男の王のほうが戦は強そうですね",45]],"247年頃、卑弥呼は狗奴国と争い、魏に使いを送って助けを求めました。守る意志と、具体的な策を示しましょう。"],
 ["千人の侍女に囲まれておると、かえって寂しいものじゃ","n",[["私でよければ、いつでもお話し相手に",0],["女王様は、民にも侍女にも慕われていますよ",8],["侍女を少し減らしましょうか？",12],["ずいぶん贅沢な悩みですね",30]],"魏志倭人伝には「婢千人」が仕えたとあります。人が多くても、心を許せる相手はいない孤独。人数の話より、話し相手になる姿勢を。"],
 ["わらわは、夫を持たぬと決めておる","n",[["その覚悟で国を背負っておられるのですね",0],["かしこまりました",8],["お一人で、寂しくはないのですか？",12],["女王様ほどの方なのに、もったいない気もします",25]],"卑弥呼は生涯夫を持たなかったと伝わります。選んだ生き方を詮索せず、背負う覚悟に敬意を。「もったいない」は価値観の押し付けです。"],
 ["鏡を百枚も賜ったのじゃ。どう使うべきかのう","n",[["各地の首長に配り、女王の威光を示しては",0],["祭りの道具として、皆に見せてはいかがでしょう",6],["せっかくですから、全部お部屋に飾りましょう",10],["一枚くらい私にもいただけます？",25]],"魏から賜った銅鏡百枚は、権威の象徴として各地に配られたとも考えられています。女王の立場に沿った提案が喜ばれます。"],
 ["お主、わらわの占いを信じておるか？","m",[["もちろん。国はそのお言葉で動いています",0],["女王様のお言葉なら、何でも信じます",8],["まあ、当たるときもけっこうありますよね",35],["正直、半分くらいですね",40]],"「女王様の言葉なら」は、占いそのものへの答えをずらしています。迷いなく信じると言い切るのが正解です。"],
 ["民がまた争っておる。どうすればよいかのう","n",[["女王様のお言葉なら、民も聞くはずです",0],["まずは、争いの理由を詳しく調べてまいります",6],["今は動かず、しばらく様子を見ましょうか",8],["兵を送って黙らせましょう",15]],"卑弥呼は、争いの続く倭国を鎮めるために諸国から共に立てられた女王です。彼女の言葉の力を信じる答えが一番響きます。"],
 ["（祭壇の前で）…少し、疲れたのう","n",[["少しお休みください。見張っております",0],["冷たいお水を、すぐにお持ちしましょうか",6],["お祈りは、あとどのくらい続くのですか？",12],["女王様でも疲れるのですね",18]],"神に仕える女王も人です。気遣いの言葉と、安心して休める状況を作る行動で応えましょう。"],
 ["わらわの国がどこにあったか、後の世で揉めておるそうじゃ","f",[["それだけ後の世に愛されているのですね",0],["畿内説と九州説があるそうですよ",8],["九州ですよね？私がはっきりさせましょう",12],["記録が少ないから仕方ないですね",20]],"引っ掛けです。場所の答えを出すのが正解に見えますが、彼女に響くのは「忘れられていない」ということ。邪馬台国の所在地は、今も畿内説と九州説で議論が続いています。"],
 ["今宵は月が赤いのう…不吉じゃ","n",[["おそばにおります。ご安心を",0],["寒いですから中へ入りましょう",6],["念のため占ってみましょうか？",8],["ただの月の色ですよ",25]],"不安を否定せず、そばにいると伝えるのが一番です。「ただの月の色」は、彼女の感じ方を切り捨てています。"],
 ["わらわの言葉を、そのまま民に伝えよ","m",[["一言も違えず、お伝えします",0],["少し分かりやすく言い換えても？",10],["長いので要点だけ伝えますね",40],["私の意見も足しておきますね",45]],"卑弥呼の言葉は、一人の男が取り次いだと伝わります。女王の言葉を正確に届けることが、側近の信頼の証です。"],
 ["魏の使いが、わらわに会いたいと申しておる","n",[["お望みの形で、場を整えます",0],["私が代わりに応対しますね",8],["せっかくですからお会いしては？",10],["外国の人は怖いですか？",20]],"人前に出ない女王の意思を尊重しつつ、準備を整えるのが一番です。会うかどうかを勝手に決めないようにしましょう。"],
 ["（宝物を見せて）この真珠、美しかろう？","n",[["ええ、女王様によくお似合いです",0],["魏の国から来たものですか？",6],["美しいですね。いくつあるのです？",8],["私には石ころにしか見えません",25]],"自慢の宝物を見せてくれたら、まず素直に褒めましょう。数や出どころの話は後回しです。"],
 ["わらわが死んだら、国はどうなるのじゃろう","m",[["女王様の教えを継ぐ者が、必ず現れます",0],["そんな縁起でもないこと、おっしゃらないでください",10],["弟君が継げば大丈夫ですよ",35],["次は男の王に代われば、国も落ち着くかと",45]],"卑弥呼の死後、男王が立つと国は乱れ、13歳の台与が女王となって治まったと伝わります。彼女の築いたものが続くと信じる言葉を。"],
 ["わらわにも、好きな食べ物くらいあるのじゃぞ","n",[["ぜひ教えてください。ご用意します",0],["意外です。いったい何がお好きなのですか？",6],["女王様も人間なんですね",12],["神に仕える方は食べないのかと",18]],"女王の素顔をのぞかせてくれた瞬間です。興味を持って聞き、行動で応えましょう。"],
 ["占いの結果、明日の狩りは取りやめじゃ","f",[["かしこまりました。皆に伝えます",0],["理由を伺ってもよろしいですか？",8],["せっかく準備したのに…",15],["少しだけなら行ってもいいのでは",30]],"引っ掛けです。裏を読む必要はありません。女王の決定を素直に受け止めて、すぐ動くのが側近の正解です。"],
 ["お主はなぜ、わらわに仕えておるのじゃ？","n",[["お言葉を届けるのが私の誇りだからです",0],["女王様に選んでいただいた、それが理由です",8],["もちろん、この国のため、民のためです",10],["ほかにやることもないので",30]],"「選ばれたから」「国のため」も悪くありませんが、女王への思いが伝わりません。仕えること自体への誇りを言葉にしましょう。"],
 ["わらわ、実は歳をとるのが怖いのじゃ","n",[["年を重ねるほど、お言葉に重みが増します",0],["何をおっしゃいます、まだまだお若いですよ",8],["誰でも歳はとりますよ",15],["確かに、最近はお疲れの様子が目立ちますね",30]],"魏志倭人伝には「年すでに長大」とあります。若さを持ち上げるより、年を重ねた価値を伝えるほうが響きます。"],
 ["（神託を終えて）…お主、今の話を聞いておったか？","m",[["はい。雨乞いの時期のお告げでしたね",0],["はい、ありがたいお言葉でした",10],["難しくてよく分かりませんでした",35],["すみません、実は少しうとうとしていました",40]],"取次役が神託を聞き逃すのは致命的です。中身を具体的に言えるかが試されています。"],
 ["倭の国々から贈り物が届いた。お主はどれがよい？","t",[["女王様への品です。私は結構です",0],["では、この布を少しだけ…",12],["全部見せてもらってもいいですか？",25],["この玉がいいです！",30]],"引っ掛けです。側近の欲を試されています。女王への品に手を出さない慎みが、信頼につながります。"],
 ["わらわの言葉が、民に届いておらぬ気がする","n",[["もっと丁寧に伝えます。私の務めです",0],["一度、民の前で直接語りかけてみては？",8],["届いていますよ。きっと気のせいです",10],["民の理解が鈍いだけですよ",20]],"言葉を届けるのは取次役の責任です。自分の務めとして引き受けましょう。直接語りかける案は、姿を見せない女王の方針に反します。"],
 ["今日は誰とも話したくないのじゃ","f",[["かしこまりました。外でお待ちします",0],["では、お食事だけは扉の外にお持ちしますね",5],["何か、お心を乱すことがあったのですか？",10],["でも、使者が来ていますよ",25]],"引っ掛けです。今回は言葉通りです。唯一出入りできる側近でも、距離を守りましょう。食事を運ぶだけなら、それも立派な気遣いです。"],
 ["後を継ぐ者に、台与という娘がおってな","n",[["女王様が見込んだ子なら心強いですね",0],["台与とは、いったいどんな娘なのですか？",6],["まだ子どもではありませんか",15],["あの娘に、女王様の代わりが務まりますかね",25]],"台与（壱与）は13歳で女王となり、国を治めたと伝わります。女王の見る目を信じる言葉を返しましょう。"],
 ["わらわの宮殿、守りが固すぎるかのう","n",[["女王様をお守りするには当然です",0],["物見やぐらを増やしましょうか",6],["少し物々しいかもしれませんね",10],["正直、窮屈そうだなと思ってました",20]],"魏志倭人伝には、宮殿は物見やぐらや柵で囲まれ、兵が常に守っていたとあります。女王を守る仕組みを肯定しましょう。"],
 ["わらわ、魏の言葉を覚えたいのじゃ","n",[["素晴らしい。使者に教わりましょう",0],["女王様なら、きっとすぐに覚えられますよ",8],["何のために覚えるのです？",12],["通訳がいるので要らないのでは",20]],"学ぶ意欲には、具体的な方法で応えるのが一番です。理由を問うたり否定したりするのは禁物です。"],
 ["今日の儀式、うまくいったかのう","n",[["皆、お告げに聞き入っていましたよ",0],["いつも通りでしたよ",8],["たぶん、いつも通り大丈夫だったと思います",10],["途中で誰かあくびしてましたね",25]],"姿を見せない女王は、民の反応を自分で見られません。見てきた様子を具体的に伝えて安心させましょう。"],
 ["わらわの力が弱まっておると噂されておる…","m",[["噂は噂です。私は女王様を信じます",0],["気にしなくていいですよ",10],["誰が言っているか調べて罰しましょう",30],["確かに、最近お告げが外れますね",45]],"「気にしなくていい」だけでは不安は消えません。信じていると言い切りましょう。噂に同意するのは大地雷です。"],
 ["（贈られた絹を広げて）…この色、わらわに似合うかの？","n",[["よくお似合いです。深い色が映えます",0],["女王様なら、どんな色でもお似合いですよ",8],["さすが魏の絹、手ざわりから質が違いますね",10],["神事には派手すぎませんか",20]],"「何色でも」は手抜きに聞こえます。具体的に似合う理由を添えましょう。"],
 ["民は、わらわを恐れておるのではないか","n",[["敬っているのです。畏れと恐れは違います",0],["そんなことはありません。考えすぎですよ",8],["女王たるもの、少しは恐れられるのも大事です",12],["まあ、姿を見せないですからね",25]],"「畏れ（敬う気持ち）」と「恐れ（怖がる気持ち）」の違いを示せると、女王の不安を言葉で解きほぐせます。"],
 ["お主の家族は元気か？","f",[["おかげさまで。お気遣い感謝します",0],["私の家族より、女王様こそご家族はお元気で？",10],["急にどうされたのですか？何かありました？",12],["私のことはいいんです",15]],"引っ掛けです。裏を読まず、素直にお礼を言えば十分です。"],
 ["わらわが泣いたら、民は驚くかのう","n",[["私の前では、泣いてもいいのですよ",0],["泣くのは結構ですが、民の前では我慢ですね",10],["女王様も泣くのですか？",12],["泣くと女王の威厳がなくなるので、やめましょう",25]],"女王であるがゆえに弱さを見せられない孤独。せめて自分の前では、と逃げ場を作ってあげましょう。"],
 ["今宵の宴、わらわは出ぬ。皆で楽しめ","t",[["女王様の分の料理を、後でお届けします",0],["少しだけでも顔を出しませんか？",12],["では遠慮なく楽しんできます！",30],["わかりました。今日は皆で無礼講ですね！",35]],"引っ掛けです。「楽しめ」は寛大な言葉ですが、一人だけ残る寂しさもあります。そっと心を配るのが側近です。"],
 ["魏の者が、わらわの国を「邪馬台」と書いたそうじゃ","n",[["女王様の国の尊さは変わりません",0],["字の意味は気にしなくていいかと",8],["抗議の使者を送りましょうか",10],["響きはかっこいいですよね",20]],"「邪馬台」「卑弥呼」の字は中国側が当てたもので、見下す意味の字だとも言われます。国の誇りを守る言葉で応えましょう。"],
 ["わらわの名、本当はどう呼ばれておったと思う？","n",[["「日の巫女」だったのではありませんか",0],["ぜひ、本当の呼び名を教えていただけますか？",8],["卑弥呼様、でしょう？",12],["呼び名なんて、正直どうでもいいと思いますよ",30]],"「卑弥呼」は魏の記録での表記です。本来は「日の巫女」「姫子」などの意味だったという説があります。"],
 ["わらわの占いが外れたら、お主はどうする？","m",[["それでもおそばでお支えします",0],["次は当たると信じます",8],["民に知られないよう隠します",30],["別の巫女を探すかもしれません",45]],"試されているのは、結果ではなく忠誠です。どんなときも支えると言い切りましょう。"],
 ["雨が降らず、民が困っておる。わらわは何をすべきか","n",[["女王様の祈りが、民の支えになります",0],["すぐに民に命じて、井戸を掘らせましょう",8],["しばらく待てば降りますよ",12],["民の中には、女王様のせいだと言う者もいます",30]],"実務の提案も大切ですが、民の心を支えるのは女王の祈りです。彼女にしかできない役目を肯定しましょう。"],
 ["お主、わらわの前で嘘をついたことはあるか？","m",[["ありません。女王様には誓って",0],["…小さな嘘なら、一度だけ",12],["嘘も方便と申しますし",40],["バレなければ嘘ではないですよね",45]],"神に仕える女王の側近に、嘘は許されません。正直に告白するのは誠実ですが、誓って無いと言えるのが理想です。"],
 ["わらわの墓は、大きいほうがよいかのう","n",[["女王様にふさわしいものを皆で築きます",0],["どのくらいの大きさの墓をお望みですか？",6],["縁起でもないことを…",10],["小さいほうが手間がかかりません",30]],"魏志倭人伝には、卑弥呼の死後に直径百余歩の大きな墓が造られたとあります。"],
 ["わらわ、たまには外を歩いてみたいのう","f",[["夜明け前、人のいない道をご案内します",0],["外は普通の景色ですよ",10],["外は危ないので、どうかおやめください",12],["いいですね、人の多い市場に行きましょう！",25]],"引っ掛けです。願いを叶えつつ、人前に出ない女王の立場も守る提案が正解です。人の多い市場は論外です。"],
 ["わらわの鬼道、お主も学びたいか？","n",[["学ばせていただけるなら光栄です",0],["鬼道とは、どんなことをするのですか？",6],["私には無理ですよ",10],["ちょっと怖いので遠慮します",20]],"自分の大切な力を分かち合おうとしてくれています。光栄だと受け取りましょう。"],
 ["今日のわらわ、機嫌がよさそうに見えるか？","n",[["はい。お声がいつもより明るいです",0],["何か良いことがありましたか？",6],["いつも通りに見えますよ",10],["御簾越しでお顔が見えないので分かりません",25]],"姿を見せない女王の機嫌は、声で感じ取るもの。具体的に気づいていることを伝えましょう。"],
 ["わらわを「女王様」ではなく、名で呼んでみよ","t",[["…卑弥呼様",0],["では、卑弥呼さん",10],["恐れ多くてできません",12],["卑弥呼ちゃん",35]],"引っ掛けです。距離を縮めたい気持ちに応えつつ、敬意は残すのが正解です。なれなれしすぎるのは論外です。"],
 ["狗奴国との戦、わらわの祈りで勝てるかのう","m",[["祈りと兵、両方で必ず守り抜きます",0],["きっと勝てますよ",8],["祈りだけでは難しいでしょうね",40],["負けたら逃げる準備をしておきます",45]],"祈りを否定せず、現実の備えも約束する。女王の不安を両面から支える答えが正解です。"],
 ["わらわの言葉を書き残す者がおればのう","n",[["私が覚えて、次の世に語り継ぎます",0],["大丈夫、魏の人がきっと記録してくれますよ",8],["では、魏の文字を習ってみましょうか",10],["残すほどのことでしょうか",30]],"当時の倭国には文字がまだ広まっておらず、卑弥呼の姿は中国の歴史書『魏志倭人伝』に残るのみです。語り継ぐと約束するのが一番の忠誠です。"],
 ["…わらわは、良い女王であったかのう","m",[["国をひとつにした、偉大な女王です",0],["もちろんです。誰が見ても良い女王ですよ",8],["良い女王ですが、弟君のおかげもありますよね",35],["まあまあ、だと思います",40]],"「良い女王」と返すだけより、何を成し遂げたかを具体的に讃えるほうが響きます。"],
 ["お主がおってくれて、助かっておる","n",[["もったいないお言葉。今後も尽くします",0],["私も女王様にお仕えできて本当に嬉しいです",6],["いえいえ、仕事ですから",12],["当然です。私がいないと困りますよね",25]],"感謝には感謝と決意で。「仕事ですから」は謙遜のつもりでも、冷たく聞こえます。"]
 ]},
jeanne:{ ura:true,
 name:"ジャンヌ", type:"救国の聖女・一途派", color:"#6D84A8", hair:"#6b4a2e",
 desc:"神の声を信じてフランスを救った聖女。あなたは彼女に仕える従者。まっすぐで嘘が嫌い。",
 quote:"「神の声を信じて」", diff:"",
 qs:[
 ["また、声が聞こえたのです","n",[["信じます。何と言っていましたか？",0],["すごいですね",8],["疲れているのでは？少し休みましょう",12],["それは本当に神の声ですか？",25]],"ジャンヌは13歳頃から、聖ミカエルや聖カタリナの声を聞いたと語りました。疑ったり疲れのせいにしたりせず、信じて中身を聞きましょう。"],
 ["オルレアンを解放しに行きます","m",[["どこまでもお供します",0],["危険すぎます。考え直しては",12],["大人の騎士たちに任せましょう",35],["女の子が戦場に？無茶ですよ",45]],"1429年、ジャンヌはイギリス軍に包囲されたオルレアンを解放し「オルレアンの乙女」と呼ばれました。決意にはついていく覚悟で応えましょう。"],
 ["この旗を見てください。剣より大事なのです","n",[["兵の心をひとつにする旗ですね",0],["きれいな旗ですね",8],["でも、戦にはやはり剣が必要では？",12],["旗じゃ身は守れませんよ",25]],"ジャンヌは「剣より旗を40倍愛している」と語りました。人を殺めないよう、旗を掲げて先頭に立ったのです。"],
 ["髪を短く切りました","n",[["決意が伝わります。よく似合っています",0],["戦うなら、短いほうが兜もかぶりやすいですね",8],["きれいな髪だったのに、もったいない気もします",15],["男の子みたいですね",25]],"髪を切ったのは戦いへの決意の表れです。実用の話より、決意と似合っていることを伝えましょう。"],
 ["兵士たちが汚い言葉を使うのが嫌なのです","n",[["私も改めます。皆にも伝えます",0],["注意すれば聞くと思いますよ",8],["戦場ですから、多少は仕方ないかと",12],["そんなに気にしなくても",20]],"ジャンヌは兵士たちに、神を冒涜する言葉を禁じたと伝わります。まず自分から改める姿勢が、彼女の信頼を得ます。"],
 ["王太子様に会いに、シノンへ行きます","n",[["きっと分かってくださいます",0],["道中は私がお守りします",6],["会ってもらえるでしょうか…",10],["農家の娘が会えるわけないですよ",30]],"シノン城でジャンヌは、家臣に紛れた王太子シャルルを一目で見抜いたと伝わります。信じて送り出す言葉を。"],
 ["（矢が肩に刺さり）…大丈夫、まだ戦えます","m",[["手当てをさせてください。すぐ戻れます",0],["無理です、今日はもうここで休んでください",10],["さすがは聖女様、矢が刺さっても痛くないんですね",40],["じゃあ、先に行きますね",45]],"オルレアンの戦いで肩に矢を受けたジャンヌは、手当ての後すぐ戦場に戻ったと伝わります。痛みを気遣い、戻る意志も尊重しましょう。"],
 ["ランスで戴冠式が行われます！","n",[["あなたの力で、ここまで来たのですね",0],["戴冠式では、あなたはどこに立つのですか？",6],["やっと王様になれますね",8],["でも結局、王様の手柄になっちゃいますね",20]],"1429年7月、ジャンヌはシャルル7世をランスで戴冠させました。王の話より、ここまで導いた彼女の功績を讃えましょう。"],
 ["私は字が読めません。恥ずかしいですか？","m",[["いいえ。言葉で人を動かす力があります",0],["大丈夫、今から字を学べば読めるようになりますよ",10],["正直、ちょっと驚きました",35],["代わりに私が読み書きも判断もしますから",40]],"ジャンヌは読み書きができず、手紙は口述で書かせたと伝わります。できないことより、彼女が持つ力に目を向けましょう。"],
 ["毎日ミサに行きたいのです","n",[["では時間を作って、ご一緒します",0],["毎日だなんて、本当に信心深いのですね",8],["戦の最中ですよ？",15],["いくら祈っても、それで戦は勝てませんよ",30]],"ジャンヌは深く信仰し、ミサや告解を欠かさなかったと伝わります。一緒に行くと言えるのが一番の理解です。"],
 ["村の両親は元気でしょうか","n",[["手紙を書きましょう。私が届けます",0],["ご両親なら、きっと村で元気にしていますよ",8],["寂しいのですか？",10],["村には、もう戻れないかもしれませんね",30]],"ジャンヌはドンレミ村の農家の娘でした。字が書けない彼女のために手紙を申し出るのは、具体的で心のこもった答えです。"],
 ["男の服を着ていることを責められました","m",[["戦うための服です。恥じることはありません",0],["周りの声なんて、気にしなくていいですよ",8],["目立つので、やめてはどうです？",35],["正直、あなたにはドレスのほうが似合うと思います",40]],"男装はのちの異端審問でも罪状の一つとされました。彼女の選択を、理由ごと肯定しましょう。"],
 ["パリの攻略に失敗しました…","n",[["あなたの勇気は、皆が見ていました",0],["次がありますよ",8],["王様の援軍が遅かったせいです",10],["神の声も外れることがあるのですね",30]],"1429年9月のパリ攻撃は失敗し、ジャンヌは負傷しました。結果より勇気を讃えましょう。声を疑うのは大地雷です。"],
 ["神様は、私たちの味方でしょうか","n",[["あなたが信じる限り、私も信じます",0],["きっとそうですよ",8],["どうしてそう思うのですか？",10],["でも、敵も同じことを神に祈っていますよね",20]],"「きっと」は軽く聞こえます。彼女の信仰に寄り添い、自分も信じると言い切りましょう。"],
 ["敵兵にも、けがの手当てをしてあげたいのです","n",[["あなたらしい。手伝います",0],["優しすぎますよ",10],["まずは味方の手当てが先ではありませんか？",12],["敵に情けは無用です",25]],"ジャンヌは敵兵の死にも涙を流したと伝わります。その優しさを肯定し、行動で支えましょう。"],
 ["（捕らえられて）…私は魔女なのでしょうか","m",[["違います。あなたは国を救った人です",0],["そんなこと言わないでください",8],["裁判で決まることですから…",40],["声が聞こえるのは普通じゃないですから",45]],"1430年に捕らえられたジャンヌは、異端の罪で裁かれました。否定するだけでなく、彼女が成したことをはっきり伝えましょう。"],
 ["私、昔は羊の番をしていたんですよ","n",[["その頃のお話、聞かせてください",0],["羊、可愛いですよね",6],["羊飼いから騎士へ、今とは大違いですね",8],["だから戦い方が素人っぽいんですね",30]],"村での素朴な日々は、彼女の大切な思い出です。興味を持って聞きましょう。"],
 ["作戦会議で、騎士たちが私の意見を聞いてくれません","n",[["あなたが正しかった。私が味方します",0],["もう一度、皆で落ち着いて話し合いましょう",8],["言い方を変えてみては？",10],["経験の差ですから仕方ないかと",15]],"歴戦の騎士たちは、農民の娘の意見を軽んじることがありました。まず味方になることが先です。"],
 ["戦いが終わったら、村に帰りたいのです","n",[["そのときは、村までお送りします",0],["まだ終わっていませんよ",8],["英雄が村に帰るのですか？",10],["英雄が村に帰るなんて、王様が許しませんよ",25]],"素朴な願いを否定せず、叶える手伝いを約束しましょう。"],
 ["王様が、もう戦をやめようと言うのです","n",[["悔しいですね。あなたの考えを聞かせて",0],["でも、少し休めるのはいいことではありませんか",10],["王様の命令なら仕方ないですね",12],["もう十分戦ったんですから、いいじゃないですか",20]],"戴冠後、シャルル7世は和平交渉に傾き、ジャンヌの進軍は止められました。悔しさに寄り添い、彼女の考えを聞きましょう。"],
 ["この剣、教会の祭壇の下から見つかったのです","n",[["神のお導きですね。大切にしましょう",0],["どうして祭壇の下にあると分かったのですか？",6],["ずいぶん古い剣ですね。ちゃんと切れますか？",10],["たまたまですよ、きっと",25]],"ジャンヌは、サント＝カトリーヌ＝ド＝フィエルボワの教会に剣があると告げ、実際に見つかったと伝わります。"],
 ["私を「乙女（ラ・ピュセル）」と呼ぶ人がいます","n",[["清らかさと強さの象徴ですね",0],["照れくさいですか？",6],["かわいい呼び名ですね",10],["戦士らしくない呼び名ですね",20]],"ジャンヌは自ら「ラ・ピュセル（乙女）」と名乗りました。彼女の誇りを肯定しましょう。"],
 ["（裁判で）難しい質問ばかりされるのです","m",[["あなたの答えは見事でした。自信を",0],["正直に答えれば大丈夫ですよ",8],["罠にかからないよう、黙っていては？",30],["学がないから不利ですよね",45]],"「神の恩寵の中にあるか」という罠の質問に、ジャンヌは「なければ神が与えてくださるよう、あるなら保ってくださるよう」と答え、審問官を驚かせたと伝わります。"],
 ["今日は怖くて、足が震えました","n",[["怖くても進んだ。それが勇気です",0],["では、次の戦いからは私が前に出ます",8],["聖女様でも怖いんですね",12],["指揮官が怖がっていては、皆が困りますよ",25]],"怖さを認めた勇気に、敬意を返しましょう。怖がったことを責めるのは論外です。"],
 ["兵たちに、戦の前に告解をさせたいのです","n",[["よい考えです。司祭を呼んできます",0],["戦の前に、告解の時間があればいいのですが",8],["兵たちは面倒がって、嫌がるかもしれませんね",10],["戦に信仰は関係ないのでは",25]],"ジャンヌは兵たちに告解を勧め、軍の規律を正したと伝わります。すぐ行動で支えましょう。"],
 ["私は、ただの農民の娘です","t",[["その娘が、国を動かしたのです",0],["身分なんて関係ないですよ",8],["謙遜しすぎですよ",10],["そうですね、普通の娘さんです",30]],"引っ掛けです。謙遜に同意するのは最悪です。何を成し遂げたかを伝えましょう。"],
 ["（勝利の後で）皆が私を讃えるのが、少し怖いのです","n",[["讃えられるのは、あなたが正しかったから",0],["あなたは英雄なんですから、讃えられて当然ですよ",10],["讃える人もいれば、妬む人もいますからね",15],["調子に乗らなければ大丈夫です",18]],"賞賛に戸惑う謙虚さに寄り添い、讃えられる理由を伝えましょう。"],
 ["声が、しばらく聞こえないのです","m",[["不安ですよね。私はそばにいます",0],["また聞こえるようになりますよ",8],["じゃあ、もう戦わなくていいですね",35],["最初から気のせいだったのでは",45]],"声は彼女の支えそのものです。不安に寄り添いましょう。声を疑うのは大地雷です。"],
 ["ブルゴーニュ軍に囲まれました…","m",[["私が道を開きます。一緒に退きましょう",0],["大丈夫、きっと神が助けてくださいます",10],["降伏したほうが安全ですよ",35],["すみません、私だけでも先に逃げていいですか",45]],"1430年、ジャンヌはコンピエーニュでブルゴーニュ軍に捕らえられました。最後まで一緒にいる覚悟を示しましょう。"],
 ["お腹が空きました。パンを分けてくれますか？","f",[["もちろん。半分どうぞ",0],["全部どうぞ。私は大丈夫です",6],["聖女様もお腹が空くのですね",12],["断食中ではなかったのですか",18]],"引っ掛けです。聖女扱いせず、素直に分け合えば十分です。"],
 ["私の旗を持つのを手伝ってください","n",[["喜んで。風が強いので支えます",0],["私が代わりに持ちましょうか？",8],["旗、少し汚れていますね",12],["重いなら置いていきましょう",20]],"旗は彼女の誇りです。取り上げるのではなく、一緒に支えるのが正解です。"],
 ["王様は、私を助けてくれるでしょうか","m",[["私は、決してあなたを見捨てません",0],["きっと助けてくださいますよ",10],["期待しないほうがいいかと",35],["王様にとって、もうあなたは用済みなのかも…",45]],"捕らえられたジャンヌを、シャルル7世は身代金を払って救おうとはしませんでした。空約束より、自分は見捨てないと伝えましょう。"],
 ["私の話を、疑わずに聞いてくれるのはあなただけです","n",[["これからも、ずっと信じます",0],["皆も本当は信じていますよ",8],["たまたまですよ",15],["正直、半信半疑なんですけどね",35]],"孤独な信頼の告白です。これからも信じると約束しましょう。"],
 ["今日は歌を歌いたい気分です","f",[["いいですね。村の歌を教えてください",0],["いいですね、兵たちもきっと喜びますね",6],["こんな戦の最中に、歌を歌うのですか？",15],["声で敵に見つかりますよ",20]],"引っ掛けです。裏はありません。一緒に楽しむのが正解です。"],
 ["私が死んだら、誰か覚えていてくれるでしょうか","m",[["私が語り継ぎます。あなたの名は残ります",0],["そんな縁起でもないこと、言わないでください",10],["教会の人たちが決めることですね",30],["どんな英雄も、どうせすぐに忘れられますよ",45]],"ジャンヌは1431年に火刑となりましたが、25年後に名誉が回復され、1920年には聖人に列せられました。"],
 ["騎士たちの間で、私は浮いていますか？","n",[["皆、あなたの背中を見て戦っています",0],["浮いているなんて、そんなことないですよ",8],["少し…でも気にしないで",12],["騎士団に女の人がいるのは珍しいですからね",20]],"否定するだけでなく、彼女が皆にどう見えているかを具体的に伝えましょう。"],
 ["軍についてきた遊女たちを、追い返しました","n",[["あなたの信念ですね。支持します",0],["兵たちは、きっと不満に思うかもしれません",10],["信念は分かりますが、少し厳しすぎませんか？",12],["そこまでしなくても…",20]],"ジャンヌは軍の規律と信仰を重んじ、陣中から遊女を追い払ったと伝わります。信念を支持しましょう。"],
 ["（初陣の前夜）…眠れません","n",[["朝まで一緒に起きています",0],["温かい飲み物を持ってきます",6],["早く寝ないと明日つらいですよ",12],["指揮官が眠れないなんて",20]],"不安な夜には、正論よりそばにいることが一番の支えです。"],
 ["ヴォークルールの隊長に、三度目のお願いに行きます","n",[["三度目の正直です。私も一緒に",0],["今度は別の言い方をしましょう",8],["しつこいと思われませんか？",12],["もう諦めたほうが…",20]],"ヴォークルールの守備隊長ボードリクールは最初ジャンヌを追い返しましたが、彼女の粘りに折れて王太子のもとへ送り出しました。"],
 ["イギリス兵の死を見て、涙が止まりません","n",[["敵のためにも泣けるあなたは尊い",0],["少し休みましょう",6],["戦ですから、仕方ありません",10],["今は、敵のために泣いている場合ではないですよ",25]],"敵の死にも涙する心を、尊いものとして受け止めましょう。"],
 ["私のしていることは、正しいのでしょうか","m",[["正しい。私はそばで見てきました",0],["きっと正しいですよ",8],["それは、後の時代の人が決めることですよ",35],["たまに、やりすぎだと思います",40]],"「きっと」ではなく、そばで見てきた者として言い切りましょう。"],
 ["あなたは神に誓って、私に嘘をついていませんか？","m",[["誓って、ついていません",0],["小さな嘘なら、ひとつだけ…",12],["誓うのはちょっと大げさでは",35],["嘘も必要なときがありますよ",40]],"神と誠実さを何より重んじる彼女に、嘘は許されません。迷わず誓いましょう。"],
 ["兜が重くて、首が痛いのです","f",[["少し外して休みましょう。見張ります",0],["では、もっと軽い兜を探してきましょう",6],["慣れるしかないですね",12],["まさか、兜なしで戦うつもりなんですか？",15]],"引っ掛けです。裏はありません。素直に休ませてあげましょう。"],
 ["（勝利の知らせに）神様、ありがとうございます！","n",[["あなたの祈りが届きましたね",0],["やりましたね！",6],["兵たちの頑張りのおかげですね",10],["運がよかっただけですよ",25]],"彼女は勝利を神に感謝しています。その信仰に寄り添う言葉が一番響きます。"],
 ["私、白い鎧を作ってもらったのです","n",[["輝いて見えます。兵の希望の光です",0],["すごい、ずいぶん値の張りそうな鎧ですね",10],["白い鎧は目立ちすぎて、危なくないですか？",12],["汚れが目立ちそうですね",20]],"ジャンヌは白銀の鎧をまとったと伝わります。見た目と、兵を奮い立たせる意味の両方を褒めましょう。"],
 ["今日、敵の司令官に手紙を出しました","n",[["戦わずに済むよう、願ったのですね",0],["何て書いたんですか？",6],["敵の司令官から、返事が来るといいですね",8],["敵に手紙なんて送ったら、きっと笑われますよ",25]],"ジャンヌは戦いの前に、イギリス軍へフランスから立ち去るよう求める手紙を送りました。その意図をくみ取りましょう。"],
 ["私はもう、この戦いから降ろされるのでしょうか","m",[["あなたが必要です。私が王に訴えます",0],["そんなことはないと思いますよ",8],["休めるならいいじゃないですか",35],["あなたの役目は、もう終わったのかもしれません",45]],"戦うことが彼女の使命です。必要だと伝え、行動で支えると約束しましょう。"],
 ["今夜は星がきれいですね","f",[["本当に。村の空と同じですか？",0],["こんなに星が見えるなら、明日は晴れそうですね",6],["せっかくだし、星占いでもしてみますか？",12],["見張りの途中ですよ",18]],"引っ掛けです。裏はありません。景色を一緒に楽しみ、話を広げましょう。"],
 ["私、本当は怖がりなんです","n",[["それでも前に立つあなたを尊敬します",0],["怖がりだなんて、全然そう見えませんよ",8],["無理しないでくださいね",10],["指揮官がそれでは、兵たちが困りますよ",25]],"怖がりなのに前に立つ。その勇気を尊敬すると伝えましょう。"],
 ["最後まで、一緒に戦ってくれますか？","m",[["最後まで、あなたの旗のそばに",0],["できる限りは、お供するつもりですが…",12],["それは、この先の戦況次第ですね",40],["給料次第ですね",45]],"最大の地雷です。迷いのない忠誠で応えましょう。"]
 ]},
sei:{ ura:true,
 name:"清少納言", type:"才気の女房・毒舌派", color:"#9A6BB5", hair:"#1f1a24",
 desc:"『枕草子』の作者。中宮定子に仕える才女。機知と教養のない返しには容赦しない。",
 quote:"「春はあけぼの。あなたは？」", diff:"",
 qs:[
 ["春はあけぼの。あなたはいつが好き？","n",[["やはり曙ですね。山際が白む頃が",0],["夏の夜も捨てがたいですね",6],["朝は眠いので、夜ですかね",15],["正直、季節なんてどれも同じではありませんか",30]],"『枕草子』冒頭「春はあけぼの。やうやう白くなりゆく山ぎは…」。彼女の感性に寄り添い、情景まで語れると満点です。"],
 ["「香炉峰の雪はいかに」と言われたら、あなたならどうする？","n",[["黙って御簾を高く上げます",0],["白楽天の詩ですね、と答えます",8],["外を見てきます、と言います",15],["雪なら外にありますよ、と答えます",30]],"中宮定子にこう問われた清少納言は、白居易の詩「香炉峰の雪は簾を撥げて看る」を踏まえ、黙って御簾を上げました。言葉でなく行動で示すのが「をかし」です。"],
 ["紫式部って、どう思う？","m",[["比べられませんよ。あなたはあなたです",0],["比べるなんて。お二人とも素晴らしい才女です",10],["源氏物語、面白いですよね！",40],["紫式部殿のほうが、少し上品な気がしますね",45]],"紫式部は日記で清少納言を「したり顔」と批判しました（二人の宮仕えの時期はずれています）。比較はご法度です。"],
 ["にくきもの。急いでいる時に長話する客","n",[["わかります。こちらの顔色を読まない方",0],["たしかに、急いでいる時に長居されると困りますね",8],["私も気をつけます…",10],["そんな客の話を聞いてあげるのも、優しさですよ",20]],"『枕草子』の「にくきもの」の段には、急ぎの時に長居する客が挙げられています。共感して具体的に乗るのが正解です。"],
 ["中宮さまが、また私の歌を褒めてくださったの","n",[["定子さまに認められるなんて、さすがです",0],["中宮さまが褒めたのは、どんな歌ですか？",6],["よかったですね",10],["中宮さまは優しいので、誰の歌でも褒めますからね",30]],"清少納言は中宮定子を心から慕っていました。その方に認められた喜びを、一緒に讃えましょう。"],
 ["この文、返事が遅いのよね。野暮だと思わない？","n",[["文の返事は、早さも風情のうちですね",0],["では、こちらから催促の文を出しましょうか",8],["お相手も、きっと忙しいのかもしれませんよ",12],["少しくらい待てばいいのでは",20]],"平安の宮廷では、文や歌への返事の早さも教養のうちでした。彼女の美意識に同意しましょう。"],
 ["夜をこめて鶏のそら音ははかるとも…さて、下の句は？","m",[["よに逢坂の関はゆるさじ、ですね",0],["それは、百人一首にも選ばれた歌ですね",10],["和歌は苦手でして…",35],["えっと、鶏がどうかしたのですか？",40]],"藤原行成とのやりとりで詠んだ、函谷関の故事を踏まえた一首です。下の句をさらりと返せれば最高の相づちです。"],
 ["今日の衣、重ねの色目はどうかしら？","n",[["桜襲ですね。春らしくて見事です",0],["とてもきれいな色の組み合わせですね",8],["それは全部で何枚重ねているのですか？",10],["ずいぶん重そうですね",20]],"平安装束は、色の組み合わせ（襲の色目）で季節を表しました。名前まで言えると、教養が伝わります。"],
 ["うつくしきもの。瓜に描いた稚児の顔","n",[["小さきものは、みなうつくし、ですね",0],["瓜に描いた顔なんて、かわいらしいですね",8],["瓜に顔を描くのですか？",10],["それって、ただの子どもの落書きでしょう？",25]],"『枕草子』「うつくしきもの」の段は「なにもなにも、小さきものはみなうつくし」と続きます。古語の「うつくし」は「かわいい」の意味です。"],
 ["私の書いたもの、読んでくださった？","m",[["もちろん。物の見方が鋭くて面白い",0],["すみません、まだ少しだけしか読めていません",12],["まだです。長いので…",40],["面白いけど、ちょっと悪口が多くないですか？",45]],"作品への感想は、具体的に褒めるのが一番です。「悪口が多い」は禁句です。"],
 ["父は歌人として有名だったの","n",[["清原元輔殿ですね。後撰集の撰者の",0],["歌の才は受け継いだのですね",6],["へえ、そうなのですか",12],["有名なお父上と比べられて、大変ですね",20]],"父・清原元輔は「梨壺の五人」として『後撰和歌集』の撰者を務めた歌人です。具体的に知っていると喜ばれます。"],
 ["（雪の日に）見て、庭が真っ白よ","n",[["見事ですね。しばし眺めましょう",0],["せっかくの雪ですし、雪山を作りましょうか？",6],["冷えますので、そろそろ戸を閉めましょうか",20],["雪かきが大変そうですね",25]],"景色の美しさを分かち合いたいのです。一緒に眺める余裕を見せましょう。『枕草子』には中宮の前で雪山を作る段もあります。"],
 ["あの方、私のことを「したり顔」と書いたそうよ","m",[["才ある人ほど、妬まれるものです",0],["気にすることはありませんよ",8],["紫式部殿の文章は上手ですからね",40],["少し当たっているかも…",45]],"紫式部は日記に、清少納言を「したり顔にいみじう侍りける人」と書きました。彼女の側に立ちましょう。"],
 ["中宮さまのお里帰りに、お供できなかったの","n",[["お寂しいですね。文を書かれては？",0],["少しの辛抱です。またすぐお会いできますよ",8],["次のお里帰りには、きっとお供できますよ",10],["休めてよかったのでは",20]],"慕う方と離れる寂しさに寄り添い、文という当時らしい手段を勧めましょう。"],
 ["すさまじきもの。昼吠える犬","n",[["時を外したものは興ざめですね",0],["昼間に吠えられると、たしかにうるさいですよね",8],["昼に吠えるのは、犬が元気な証拠では？",15],["犬くらい吠えますよ",20]],"「すさまじきもの（興ざめなもの）」の段の冒頭です。季節や時を外れたものへの鋭い感覚が、彼女らしさです。"],
 ["私、漢詩もそれなりに読めるのよ","t",[["存じています。その教養には敵いません",0],["どんな詩がお好きですか？",6],["実は、私も漢詩なら少しは読めますよ",12],["女性なのに漢詩が読めるなんて、珍しいですね",40]],"引っ掛けです。当時、漢学は男性のものとされ、清少納言は漢詩の知識で宮中を驚かせました。「女性なのに」は大地雷です。"],
 ["夏は夜。月の頃はさらなり","n",[["蛍の飛ぶ闇夜も、また良いですね",0],["では、今宵は月見でもいたしましょうか？",8],["夜は涼しいですからね",10],["でも、夜は暗くて何も見えないでしょう",25]],"「夏は夜。月の頃はさらなり、闇もなほ、蛍の多く飛びちがひたる」と続きます。続きを踏まえて返せると満点です。"],
 ["ありがたきもの。舅に褒めらるる婿","n",[["めったにない、という意味ですね",0],["言い得て妙ですね",6],["婿の苦労が目に浮かびます",8],["感謝するもの、ということですか？",20]],"古語の「ありがたし」は「めったにない」の意味です。今の「感謝」と取り違えるのは、才女の前では致命的です。"],
 ["最近、宮中で私の悪口が広まっているの","m",[["信じません。あなたの誠は知っています",0],["噂なんて、放っておけばそのうち収まりますよ",10],["道長殿に近づいたからでは？",40],["火のない所に煙は立たぬ、とも申しますし…",45]],"定子の兄たちが失脚した頃、清少納言は藤原道長方に通じていると噂され、里に下がったと伝わります。"],
 ["（扇で顔を隠しながら）…何かご用？","f",[["季節の花をお届けに参りました",0],["特に用はないのですが",10],["扇で隠すなんて、ご機嫌ななめですか？",12],["扇を下ろして、顔を見せてくださいよ",20]],"引っ掛けです。扇で顔を隠すのは当時の女性の作法で、不機嫌のサインではありません。風情ある用件で応じましょう。"],

let typeTimer = null;
function finishType(){
  clearInterval(typeTimer); typeTimer=null;
  const el=document.getElementById("sayText"); if(el) el.textContent=el.dataset.full;
  if(S.screen==="game"){ S.typedIdx=S.idx; if(S.timed && !S.deadline && S.picked===null) S.deadline=Date.now()+LIMIT; }
}
function typeSay(){
  clearInterval(typeTimer); typeTimer=null;
  const el=document.getElementById("sayText"); if(!el) return;
  if(S.typedIdx===S.idx || S.picked!==null){ finishType(); return; }
  const full=el.dataset.full; let i=0;
  const draw=()=>{ el.innerHTML = esc(full.slice(0,i))+'<span class="rest">'+esc(full.slice(i))+'</span>'; };
  draw();
  typeTimer=setInterval(()=>{
    i++; draw();
    const ch=full[i-1];
    if(i%2===1 && !/[、。！？…\s〜ー「」（）・]/.test(ch)) SND.fx("blip", VOICE[S.id]);
    if(i>=full.length) finishType();
  }, 55);
}
function music(){
  if(S.screen==="title"||S.screen==="select") SND.play("main");
  else if(S.screen==="game") SND.play(S.irr>=55?"tense":"quiz");
  else SND.stop();
}
document.addEventListener("pointerdown", ()=>{ SND.unlock(); music(); });
document.addEventListener("keydown", ()=>{ SND.unlock(); music(); });
function render(justAnswered){
  document.body.classList.add("crt");
  document.body.classList.toggle("ura", S.screen==="select" ? URA : !!(S.id && CHARS[S.id].ura && S.screen!=="title"));
  music();
  app.innerHTML = S.screen==="title" ? titleView() : S.screen==="select" ? selectView() : S.screen==="game" ? gameView() : endView(S.screen==="clear");
  if(S.screen==="game") typeSay();
  if(justAnswered){
    const q = CHARS[S.id].qs[S.order[S.idx]], ci = S.perm[S.picked];
    const st = document.getElementById("stage");
    if(ci===0) st?.classList.add("bounce");
    else if(S.picked<0){ document.getElementById("meter")?.classList.add("flash"); }
    else if(q[2][ci][1]>=25){ st?.classList.add("shake"); document.getElementById("meter")?.classList.add("flash"); }
    document.getElementById("nextBtn")?.focus({preventScroll:true});
  }
}

app.addEventListener("click", e=>{
  if(e.target.closest(".bubble")){ if(typeTimer) finishType(); return; }
  const b = e.target.closest("button"); if(!b) return;
  if(b.dataset.start) start(b.dataset.start);
  else if(b.dataset.mode){ MODE=b.dataset.mode; SND.fx("select"); S={screen:"select"}; render(); }
  else if(b.dataset.act==="press"){ pressed=true; SND.unlock(); SND.fx("select"); render(); }
  else if(b.dataset.act==="ura"){ URA=!URA; SND.fx("select"); render(); }
  else if(b.dataset.act==="select"){ SND.fx("select"); S={screen:"select"}; render(); }
  else if(b.dataset.pick!==undefined) answer(+b.dataset.pick);
  else if(b.dataset.act==="next") next();
  else if(b.dataset.act==="title"){ SND.fx("select"); S={screen:"title"}; render(); }
  else if(b.dataset.act==="sound"){ SND.setOn(!SND.on); SND.unlock(); if(SND.on) SND.fx("select"); render(); }
});
document.addEventListener("keydown", e=>{
  if(S.screen!=="game") return;
  const k = e.key.toUpperCase();
  if(S.picked===null && ["A","B","C","D","1","2","3","4"].includes(k)) answer("ABCD".includes(k)?"ABCD".indexOf(k):+k-1);
});

function boot(data){ if(data && data.screen){ S = data; pressed = true; if(S.timed) MODE="doki"; } SND.unlock(); render(); }
window.claude?.hot?.snapshot?.(()=>S);
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
